{% extends 'base.html' %}
{% block title %}Edit Product #{{ product.id }} - Admin{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="m-0 fw-bold"><i class="bi bi-pencil-square text-primary me-2"></i>Edit Product #{{ product.id }}</h3>
                <a href="{{ url_for('admin.products') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                    <i class="bi bi-arrow-left"></i> Back to Products
                </a>
            </div>
            
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <form action="{{ url_for('admin.edit_product', product_id=product.id) }}" method="POST">
                        <div class="row">
                            <div class="col-md-12 mb-3">
                                <label class="form-label fw-bold">Product Name</label>
                                <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Brand</label>
                                <input type="text" name="brand" class="form-control" value="{{ product.brand }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Category</label>
                                <input type="text" name="category" class="form-control" value="{{ product.category }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Price (₹)</label>
                                <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Stock Quantity</label>
                                <input type="number" name="stock" class="form-control" value="{{ product.stock }}" required>
                            </div>
                            <div class="col-md-12 mb-3">
                                <label class="form-label fw-bold">Image URL</label>
                                <input type="text" name="image" class="form-control" value="{{ product.image }}">
                                {% if product.image %}
                                <div class="mt-2 text-center p-2 bg-light rounded border">
                                    <small class="text-muted d-block mb-1">Current Preview:</small>
                                    <img src="{{ product.image }}" alt="{{ product.name }}" style="max-height: 100px; object-fit: contain;">
                                </div>
                                {% endif %}
                            </div>
                            <div class="col-md-12 mb-3">
                                <label class="form-label fw-bold">Badge (e.g., Best Seller, Trending, New)</label>
                                <input type="text" name="badge" class="form-control" value="{{ product.badge or '' }}">
                            </div>
                            <div class="col-md-12 mb-4">
                                <label class="form-label fw-bold">Description</label>
                                <textarea name="description" class="form-control" rows="3">{{ product.description }}</textarea>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">
                                <i class="bi bi-save me-1"></i> Save Changes
                            </button>
                            <a href="{{ url_for('admin.products') }}" class="btn btn-light rounded-pill px-4">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
