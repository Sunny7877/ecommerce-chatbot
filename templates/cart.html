{% extends 'base.html' %}
{% block title %}Shopping Cart - ShopEase AI{% endblock %}
{% block content %}
<div class="container py-5">
    <h2 class="fw-bold mb-4">Your Shopping Cart</h2>
    <div class="row">
        <div class="col-md-8">
            <div id="cart-items" class="bg-white rounded shadow-sm p-4 mb-4">
                <!-- Cart items will be injected by JS -->
            </div>
            <a href="{{ url_for('products_page') }}" class="btn btn-outline-primary"><i class="bi bi-arrow-left"></i> Continue Shopping</a>
        </div>
        <div class="col-md-4">
            <div class="bg-white rounded shadow-sm p-4">
                <h5 class="fw-bold mb-3">Order Summary</h5>
                <div class="d-flex justify-content-between mb-2">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">₹0.00</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span>Delivery Charges</span>
                    <span class="text-success">Free</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between mb-4">
                    <span class="fw-bold">Total</span>
                    <span class="fw-bold fs-5 text-primary" id="cart-total">₹0.00</span>
                </div>
                <a href="{{ url_for('checkout') }}" id="checkout-btn" class="btn btn-primary w-100 btn-lg">Proceed to Checkout</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function renderCart() {
    const cartItemsEl = document.getElementById('cart-items');
    let total = 0;
    
    if (cart.length === 0) {
        cartItemsEl.innerHTML = '<p class="text-center text-muted my-5">Your cart is empty.</p>';
        document.getElementById('cart-subtotal').innerText = '₹0.00';
        document.getElementById('cart-total').innerText = '₹0.00';
        document.getElementById('checkout-btn').classList.add('disabled');
        return;
    }
    
    document.getElementById('checkout-btn').classList.remove('disabled');
    
    let html = '';
    cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        html += `
        <div class="d-flex align-items-center mb-4 pb-4 border-bottom">
            <img src="${item.image}" alt="${item.name}" style="width: 80px; height: 80px; object-fit: cover;" class="rounded me-3">
            <div class="flex-grow-1">
                <h5 class="mb-1">${item.name}</h5>
                <span class="text-primary fw-bold">₹${item.price.toFixed(2)}</span>
            </div>
            <div class="d-flex align-items-center me-4">
                <button onclick="updateQty(${index}, -1)" class="btn btn-sm btn-outline-secondary px-2">-</button>
                <span class="mx-3">${item.quantity}</span>
                <button onclick="updateQty(${index}, 1)" class="btn btn-sm btn-outline-secondary px-2">+</button>
            </div>
            <div class="fw-bold me-4">₹${itemTotal.toFixed(2)}</div>
            <button onclick="removeItem(${index})" class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></button>
        </div>
        `;
    });
    
    cartItemsEl.innerHTML = html;
    document.getElementById('cart-subtotal').innerText = '₹' + total.toFixed(2);
    document.getElementById('cart-total').innerText = '₹' + total.toFixed(2);
}

function updateQty(index, change) {
    if (cart[index].quantity + change > 0) {
        cart[index].quantity += change;
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
        updateCartCount();
    }
}

function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
    updateCartCount();
}

document.addEventListener('DOMContentLoaded', renderCart);
</script>
{% endblock %}
