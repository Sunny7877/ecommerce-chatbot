{% extends 'base.html' %}
{% block title %}Track Order - ShopEase AI{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <h2 class="fw-bold mb-4">Track Your Order</h2>
            <div class="card shadow-sm border-0 p-4 rounded-4">
                <form id="track-form">
                    <div class="input-group mb-3 p-1 bg-light rounded-pill border">
                        <input type="text" id="order_id" class="form-control border-0 bg-transparent shadow-none ms-2" placeholder="Enter Order ID (e.g., ORD2026...)" required>
                        <button class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm" type="submit">Track Order</button>
                    </div>
                </form>
                <div id="track-result" class="mt-4"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('track-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const orderId = document.getElementById('order_id').value.trim();
    const resultDiv = document.getElementById('track-result');
    
    // Loader
    resultDiv.innerHTML = '<div class="spinner-border text-primary" role="status"></div>';
    
    try {
        const res = await fetch('/api/track', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({order_id: orderId})
        });
        const data = await res.json();
        
        if(data.success) {
            let paymentBadge = data.payment_status === 'PAID' ? 'bg-success' : (data.payment_status === 'COD_CONFIRMED' ? 'bg-primary' : (data.payment_status === 'CREATED' ? 'bg-warning text-dark' : 'bg-danger'));
            let orderBadge = data.status === 'Pending' ? 'bg-warning text-dark' : 'bg-success';

            resultDiv.innerHTML = `
                <div class="alert alert-light border shadow-sm rounded-4 text-start p-4">
                    <h5 class="fw-bold mb-4 border-bottom pb-3">Tracking Details for <span class="text-primary">${orderId}</span></h5>
                    <div class="row g-3">
                        <div class="col-6">
                            <small class="text-muted fw-bold d-block">ORDER STATUS</small>
                            <span class="badge ${orderBadge} fs-6 px-3 py-2 mt-1">${data.status}</span>
                        </div>
                        <div class="col-6">
                            <small class="text-muted fw-bold d-block">PAYMENT STATUS</small>
                            <span class="badge ${paymentBadge} fs-6 px-3 py-2 mt-1">${data.payment_status}</span>
                        </div>
                        <div class="col-12 mt-4">
                            <small class="text-muted fw-bold d-block">ORDER PLACED ON</small>
                            <p class="mb-0 fw-semibold mt-1">${new Date(data.date).toLocaleString()}</p>
                        </div>
                    </div>
                </div>
            `;
        } else {
            resultDiv.innerHTML = `
                <div class="alert alert-danger rounded-3 fw-bold">
                    <i class="bi bi-exclamation-circle-fill me-2"></i> ${data.message}
                </div>
            `;
        }
    } catch (err) {
        resultDiv.innerHTML = `<div class="alert alert-danger rounded-3">Error tracking order. Please try again.</div>`;
    }
});
</script>
{% endblock %}
