{% extends 'base.html' %}
{% block title %}ShopEase AI - My Wishlist{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-heart-fill text-danger me-2"></i> My Wishlist</h2>
    </div>

    <div id="wishlist-container" class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4">
        <!-- Wishlist rendered via JS -->
    </div>
    
    <div id="empty-wishlist" class="text-center py-5 d-none">
        <i class="bi bi-heart fs-1 text-muted mb-3 d-block"></i>
        <h4 class="fw-bold">Your Wishlist is empty</h4>
        <p class="text-muted">Save items you love here to buy them later.</p>
        <a href="{{ url_for('products_page') }}" class="btn btn-primary mt-3 px-4 py-2 rounded-pill fw-bold">Start Shopping</a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function renderWishlist() {
        const container = document.getElementById('wishlist-container');
        const emptyState = document.getElementById('empty-wishlist');
        
        container.innerHTML = '';
        if(wishlist.length === 0) {
            emptyState.classList.remove('d-none');
            return;
        }
        
        emptyState.classList.add('d-none');
        
        wishlist.forEach(item => {
            const col = document.createElement('div');
            col.className = 'col';
            col.innerHTML = `
                <div class="card product-card border-0 shadow-sm h-100 position-relative">
                    <button class="btn btn-danger position-absolute top-0 end-0 m-2 rounded-circle shadow-sm" onclick="removeWishlistItem(${item.id})">
                        <i class="bi bi-trash-fill"></i>
                    </button>
                    <a href="/product/${item.id}" class="product-img-wrapper">
                        <img src="${item.image}" class="product-img w-100" alt="${item.name}">
                    </a>
                    <div class="card-body d-flex flex-column pt-0">
                        <h6 class="card-title text-truncate fw-bold mb-2 mt-3"><a href="/product/${item.id}" class="text-dark">${item.name}</a></h6>
                        <div class="mt-auto border-top pt-3">
                            <span class="fs-5 fw-bold text-dark d-block mb-3">₹${item.price.toLocaleString()}</span>
                            <button class="btn btn-primary w-100 fw-bold rounded-pill" onclick="addToCart(${item.id}, '${item.name}', ${item.price}, '${item.image}')">
                                Move to Cart
                            </button>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(col);
        });
    }

    function removeWishlistItem(id) {
        const index = wishlist.findIndex(item => item.id === id);
        if (index > -1) {
            wishlist.splice(index, 1);
            localStorage.setItem('wishlist', JSON.stringify(wishlist));
            updateCounts();
            renderWishlist();
            showToast('Removed', 'Item removed from wishlist.');
        }
    }

    document.addEventListener('DOMContentLoaded', renderWishlist);
</script>
{% endblock %}
